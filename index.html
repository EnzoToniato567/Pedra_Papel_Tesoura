<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Pedra papel e tesoura</title>
</head>

<body>

    <header class="introducao">
        <img src="./images/logogame.png" alt="Logo do Jogo">
        <div class="placar">
            <h2 class="score">Pontos</h2>
            <p class="pontuacao">0</p>
        </div>
    </header>

    <main class="jogo">
        <img class="hexagono" src="./images/hexagono.png" alt="Hexagono">

        <!-- Papel -->
        <div class="container container-papel" onclick="jogar(papel)">
            <button value="papel" class="papel opcao"><span>✋</span></button>
        </div>
        <!-- Tesoura -->
        <div class="container container-tesoura" onclick="jogar(tesoura)">
            <button value="tesoura" class="tesoura opcao"><span>✌️</span></button>
        </div>
        <!-- Pedra -->
        <div class="container container-pedra" onclick="jogar(pedra)">
            <button value="pedra" class="pedra opcao"><span>✊</span></button>
        </div>
        <!-- Spock -->
        <div class="container container-spock" onclick="jogar(spock)">
            <button value="spock" class="spock opcao"><span>🖖</span></button>
        </div>
        <!-- Lagarto -->
        <div class="container container-lagarto" onclick="jogar(lagarto)">
            <button value="lagarto" class="lagarto opcao"><span>🦎</span></button>
        </div>
    </main>

    <!-- Regras -->
    <div id="regra" class="regras">
        <div class="regras-titulo">
            <h1>Regras</h1>
            <button onclick="fecharRegras()"><img src="./images/icon-close.svg" alt=""></button>
        </div>
        <img src="./images/spockregras.png" alt="">
    </div>

    <!-- GamePlay -->
    <div class="gameplay">
        <div class="player display">
            <h2 class="persona">Você Escolheu</h2>
            <p class="test"></p>
        </div>

        <div class="fim">
            <p class="result"></p>
            <button class="playAgain" onclick="reset()">Jogar Novamente</button>
        </div>

        <div class="house display">
            <h2 class="persona">O Computador Escolheu</h2>
            <p class="test1"></p>
        </div>
    </div>

    <button class="regras-button" onclick="mostrarRegras()">Regras</button>

    <script src="script.js"></script>
</body>

</html>
